name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: portafolio-yc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and Worker dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Preview Worker deployment
        env:
          WRANGLER_SEND_METRICS: "false"
        run: bunx wrangler deploy --dry-run --config wrangler.jsonc
